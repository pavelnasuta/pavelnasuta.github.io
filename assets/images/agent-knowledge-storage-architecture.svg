<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Архитектура связки Hermes и Anytype</title>
  <desc id="desc">Человек работает с Anytype на ноутбуке и телефоне. Hermes на сервере обращается к выделенному API-доступу Anytype и создаёт проверяемые артефакты в общем рабочем пространстве.</desc>
  <defs>
    <style>
      .ink{fill:#102e3d}.muted{fill:#59717a}.teal{fill:#08716e}.line{stroke:#102e3d;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.soft{stroke:#bed1ce;stroke-width:2;fill:none}.dash{stroke:#08716e;stroke-width:3;stroke-dasharray:10 10;fill:none;stroke-linecap:round}.card{fill:#fbfcfa;stroke:#102e3d;stroke-width:3}.paper{fill:#f4f7f3}.pale{fill:#d6ede5}.orange{fill:#dd7448}.label{font:700 17px Arial,sans-serif;letter-spacing:.08em}.small{font:400 18px Arial,sans-serif}.mono{font:700 14px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;letter-spacing:.08em}
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#102e3d"/></marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#08716e"/></marker>
  </defs>
  <rect width="1200" height="700" rx="20" class="paper"/>
  <text x="58" y="62" class="mono teal">КАК РЕЗУЛЬТАТ РАБОТЫ АГЕНТА СТАНОВИТСЯ ДОСТУПЕН ЧЕЛОВЕКУ</text>
  <line x1="58" y1="92" x2="1142" y2="92" class="soft"/>

  <g transform="translate(58 156)">
    <text x="0" y="0" class="label ink">ЧЕЛОВЕК</text>
    <text x="0" y="31" class="small muted">читает, проверяет, решает</text>
    <rect x="2" y="76" width="222" height="140" rx="12" class="card"/>
    <rect x="17" y="91" width="192" height="100" rx="6" class="pale"/>
    <path d="M81 216h64m-90 18h116" class="line"/>
    <circle cx="50" cy="141" r="14" class="orange"/>
    <path d="M78 126h100M78 150h78M78 174h56" class="line"/>
    <rect x="261" y="105" width="66" height="118" rx="12" class="card"/>
    <rect x="272" y="121" width="44" height="71" rx="4" class="pale"/>
    <circle cx="294" cy="207" r="4" class="ink"/>
    <text x="2" y="267" class="mono muted">НОУТБУК · ТЕЛЕФОН</text>
  </g>

  <g transform="translate(437 139)">
    <rect width="334" height="318" rx="16" class="card"/>
    <rect x="0" y="0" width="334" height="51" rx="16" class="ink"/>
    <text x="24" y="33" class="label" fill="#fbfcfa">ANYTYPE SPACE</text>
    <text x="25" y="83" class="mono teal">ЧЕЛОВЕЧЕСКИЙ СЛОЙ</text>
    <rect x="25" y="105" width="284" height="50" rx="7" class="pale"/>
    <text x="42" y="137" class="small ink">Проекты и решения</text>
    <rect x="25" y="169" width="190" height="50" rx="7" class="card"/>
    <text x="42" y="201" class="small ink">Исследования</text>
    <rect x="119" y="233" width="190" height="50" rx="7" class="card"/>
    <text x="136" y="265" class="small ink">Итоги и задачи</text>
    <path d="M215 194h58v39M214 194h-51v-38" class="soft"/>
    <circle cx="164" cy="156" r="5" class="teal"/>
    <circle cx="215" cy="194" r="5" class="teal"/>
    <circle cx="273" cy="233" r="5" class="teal"/>
  </g>

  <g transform="translate(880 156)">
    <text x="0" y="0" class="label ink">HERMES</text>
    <text x="0" y="31" class="small muted">ищет, собирает, предлагает</text>
    <rect x="0" y="76" width="260" height="167" rx="14" class="ink"/>
    <rect x="21" y="97" width="218" height="41" rx="7" fill="#d6ede5"/>
    <circle cx="42" cy="117" r="7" class="orange"/>
    <path d="M65 109h142M65 126h93" stroke="#08716e" stroke-width="4" stroke-linecap="round"/>
    <path d="M27 163h206M27 192h206M27 221h123" stroke="#59717a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="219" cy="221" r="7" class="teal"/>
    <text x="0" y="289" class="mono muted">СЕРВЕР · SKILL · ПРАВИЛА</text>
  </g>

  <path d="M390 278h39" class="line" marker-end="url(#arrow)"/>
  <path d="M780 252h82" class="dash" marker-end="url(#arrowTeal)"/>
  <path d="M862 342h-82" class="dash" marker-end="url(#arrowTeal)"/>
  <text x="786" y="229" class="mono teal">ПОИСК · ЧТЕНИЕ</text>
  <text x="786" y="376" class="mono teal">ПРОВЕРЯЕМЫЕ ПРАВКИ</text>
  <path d="M604 482v70" class="line" marker-end="url(#arrow)"/>

  <g transform="translate(256 574)">
    <rect width="688" height="81" rx="12" fill="#102e3d"/>
    <text x="27" y="29" class="mono" fill="#d6ede5">РЕЗУЛЬТАТ</text>
    <text x="27" y="48" class="small" fill="#fbfcfa">Не сообщение в чате, а материал, который можно</text>
    <text x="27" y="70" class="small" fill="#fbfcfa">открыть, найти и использовать.</text>
  </g>
</svg>
